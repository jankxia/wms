<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        AcceptPathInfo On
    </Directory>

    # 上传目录体积可能较大，避免日志刷屏
    SetEnvIf Request_URI "^/uploads/" dontlog

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined env=!dontlog
</VirtualHost>
