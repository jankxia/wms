; WMS 生产环境 PHP 配置（容器内覆盖）
memory_limit = 256M
max_execution_time = 120
post_max_size = 32M
upload_max_filesize = 32M
date.timezone = Asia/Shanghai
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
session.cookie_httponly = 1
session.use_strict_mode = 1

; 说明：部署到飞牛 NAS 时如果文件较大（Excel 导入），可以上调 upload_max_filesize。
